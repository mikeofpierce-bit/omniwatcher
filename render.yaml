services:
  - type: web
    name: omniwatch-network
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COOKIE_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: omniwatch-data
      mountPath: /data
      sizeGB: 1
